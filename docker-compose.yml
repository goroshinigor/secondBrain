services:
  app:
    build:
      context: ./docker/app
      args:
        UID: "${APP_UID:-1000}"
        GID: "${APP_GID:-1000}"
    volumes:
      - ./src:/var/www/html:cached
    ports:
      - "5173:5173"
    depends_on: [db, redis, ollama]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  dbdata:
  ollama_models: